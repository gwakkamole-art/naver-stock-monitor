name: Naver stock monitor
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe: 접속만 검사 / monitor: 재고 알림 / telegram: 알림 시험'
        type: choice
        options: [probe, monitor, telegram]
        default: probe
      runner:
        description: '무료 표준 실행 환경'
        type: choice
        options: [macos-15, ubuntu-24.04]
        default: macos-15
  schedule:
    - cron: '3-58/5 * * * *'
permissions:
  contents: read
concurrency:
  group: naver-stock-monitor
  cancel-in-progress: false
jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || vars.MONITOR_ENABLED == 'true'
    runs-on: ${{ inputs.runner || vars.MONITOR_RUNNER || 'macos-15' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - uses: actions/cache/restore@v4
        if: inputs.mode != 'probe' && inputs.mode != 'telegram'
        with:
          path: state
          key: stock-state-v2-${{ github.run_id }}
          restore-keys: stock-state-v2-
      - name: Check stock
        id: monitor
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_MODE: ${{ inputs.mode || 'monitor' }}
        run: |
          case "$RUN_MODE" in
            probe) python monitor.py --probe ;;
            telegram) python monitor.py --test-telegram ;;
            monitor) python monitor.py ;;
            *) exit 2 ;;
          esac
      - uses: actions/cache/save@v4
        if: always() && steps.monitor.outputs.changed == 'true'
        with:
          path: state
          key: stock-state-v2-${{ github.run_id }}
